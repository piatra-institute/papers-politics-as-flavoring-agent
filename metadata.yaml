abstract: |-
  A consumer who will not switch phones over a country's politics will switch beer over an advertisement, and the asymmetry is usually explained by the phone costing more. This paper argues it is explained by the phones differing and the beers not. When functional quality across competing products has converged, political meaning takes over the work of differentiation, and it does so in two ways an outside observer cannot tell apart. Under sorting, politics changes which good a consumer chooses while leaving the good's experienced quality intact; under flavoring, politics changes the experience itself, so the same physical good is tasted as better when its label aligns and worse when it does not, the way a price tag moves reported pleasantness in the neural-imaging studies. The paper builds the smallest model that holds both channels and a mixture parameter for how much of the political premium runs through flavoring rather than sorting. Solved over a population of 60,000 consumers in a polarized electorate, the first result is negative and exact: at the quality plateau the labeled market is invariant to the mixture, so the choice data that revealed-preference analysis relies on are identical for every split between the two channels, and the political premium of 0.362 in functional-quality units is consistent with any flavoring share in the unit interval. Only a quantity the market never generates identifies the split, the within-good swing between a good's blind rating and its labeled rating, which the model fixes at 0.202 per unit of flavoring share and which is exactly the design of the relabeling experiment. The second result makes the plateau quantitative: sweeping functional dispersion locates a threshold near 0.445 below which politics decides the majority of contested choices, and placing ten categories on that axis reproduces the received susceptibility ordering, bottled water through cosmetics on the flavor-dominated side, phones through medical devices on the other, as an output rather than an assertion. The third result prices brand activism. Because moral contamination is negativity-dominant, with the misalignment penalty here 2.33 times the alignment bonus, a neutral good that adopts a political position loses a centered mass-market base by 0.036 of demand while a symmetric model gains it 0.008, and the position pays only for a base already concentrated beyond 0.425 toward the adopted pole, which is the large-share-brand penalty derived from the contagion asymmetry alone. The construct says what would have to be measured to call any market politically flavored. It does not certify that any named market is, and the closing section is precise about the difference. Ships a runnable simulation whose output carries every modelled number.
