- id: plassmann-price
  kind: source
  passage: Subjects told that a wine is more expensive rate it as more pleasant and show higher activity
    in orbitofrontal regions that encode experienced pleasantness, with the wine held fixed [@plassmann2008].
  evidence:
    citation_id: plassmann2008
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1073/pnas.0706929105; Crossref abstract: raising the stated price of a
      wine increases reported flavour pleasantness and BOLD activity in medial orbitofrontal cortex.'
- id: lee-beer
  kind: source
  passage: Subjects told before tasting that a beer contains a distinctive additive like it less, while
    subjects told afterwards do not, so the expectation moves the verdict independently of the chemistry
    [@lee2006].
  evidence:
    citation_id: lee2006
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1111/j.1467-9280.2006.01829.x; Crossref abstract: disclosing the added
      vinegar reduced preference only when disclosure preceded tasting, so expectation affected the experience
      itself.'
- id: chapman-disgust
  kind: source
  passage: 'The route by which a price cue enters a taste can carry a political cue in the same way, and
    moral psychology supplies the second half of that route: moral judgment recruits the machinery of
    physical disgust, so a moralized object can be experienced as contaminated in addition to being disapproved
    of [@chapman2009; @rozin1999].'
  evidence:
    citation_id: chapman2009
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1126/science.1165565; Crossref abstract: gustatory distaste, basic disgust
      and moral disgust (unfair treatment) all activate the levator labii region, so immorality elicits
      the same disgust as bad tastes.'
- id: rozin-negativity
  kind: source
  passage: Negativity dominance is the regularity that combining a negative element with a positive one
    yields an outcome more negative than the parts predict, most pronounced in contagion, where a drop
    of sewage spoils a barrel of wine and a drop of wine does nothing for a barrel of sewage [@rozin2001;
    @baumeister2001].
  evidence:
    citation_id: rozin2001
    locator: Abstract
    verified: true
    verification_note: DOI 10.1207/S15327957PSPR0504_2; Crossref abstract defines negativity dominance
      as combinations of negative and positive entities yielding evaluations more negative than the algebraic
      sum, with emphasis on contagion.
- id: hydock-share
  kind: source
  passage: 'Applied to consumption, it predicts that political misalignment spoils a good more than alignment
    improves it, and the marketing evidence agrees: disagreement with a brand''s stance damages attitudes
    more than agreement repairs them [@mukherjee2020], and divisive stances are riskier for brands with
    more to lose [@hydock2020].'
  evidence:
    citation_id: hydock2020
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1177/0022243720947682 (Journal of Marketing Research 57(6)); Crossref abstract:
      corporate political advocacy repels opposing customers more than it attracts supporters and hurts
      large-share brands while benefiting small-share brands.'
- id: hainmueller-fair-trade
  kind: source
  passage: Ethical labels of this kind move real purchases as well as stated attitudes, as a multistore
    field experiment on fair-trade coffee showed [@hainmueller2015].
  evidence:
    citation_id: hainmueller2015
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1162/REST_a_00467; Crossref abstract: in grocery-store experiments sales
      of the two most popular coffees rose almost 10% with a Fair Trade label relative to a placebo label.'
- id: kam-boycott-buycott
  kind: source
  passage: A large literature treats buying and boycotting as political participation [@stolle2005; @micheletti2003],
    measures its prevalence and its participants [@newman2011; @endres2017], distinguishes the approach
    motive of the buycott from the avoidance motive of the boycott [@neilson2010; @kam2020], and asks
    when a firm's public stance helps or hurts it [@vredenburg2020; @bhagwat2020].
  evidence:
    citation_id: kam2020
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1086/705922; Crossref abstract: boycotting and buycotting are framed as
      avoidance and approach, and negative information is far more powerful in inducing boycotts than
      positive information is in inducing buycotts.'
- id: sorting-definition
  kind: definition
  passage: We call this sorting, because it sorts buyers across goods without altering the goods.
  rationale: Defines the first channel.
- id: flavoring-definition
  kind: definition
  passage: We call this flavoring.
  rationale: Defines the second channel.
- id: phi-definition
  kind: definition
  passage: The mixture parameter $\phi \in [0, 1]$ is the share of the political charge that runs through
    flavoring.
  rationale: Defines the quantity whose identification is at issue.
- id: illustrative-magnitudes
  kind: assumption
  passage: 'The magnitudes are illustrative, anchored to published effect sizes and not estimated for
    any market: $\lambda_{+} = 0.15$ lies in the range of the price-on-pleasantness and label-on-taste
    shifts, and $\lambda_{-} = 0.35$ sets the contamination penalty at $2.33$ times the bonus, within
    the band reported in the negativity-dominance literature.'
  rationale: All parameters are stipulated; results are properties of the parameterization.
- id: plateau-invariance
  kind: interpretation
  passage: which does not contain $\phi$.
  rationale: Analytic result at F_R = F_L = F0; confirmed numerically by zero share dispersion across
    the phi grid.
- id: identification-only-blind
  kind: interpretation
  passage: No market statistic recovers it, because a market never serves the same good to the same buyer
    under two labels and records the hedonic difference.
  rationale: 'Negative identification result: only a within-good blind-versus-labeled rating identifies
    phi.'
- id: ordinal-categories
  kind: assumption
  passage: The category dispersions are ordinal stipulations, so the partition shows that a single threshold
    can generate the received ordering; it does not establish that the dispersion of bottled water is
    $0.03$.
  rationale: Category placements are stipulated; the partition shows only that one threshold can reproduce
    the received ordering.
- id: activism-asymmetry
  kind: interpretation
  passage: The loss is due entirely to the asymmetry.
  rationale: Comparison of the asymmetric and symmetric control results bound above.
- id: public-cases
  kind: interpretation
  passage: The model supplies no verdict on these cases; it provides a vocabulary that keeps symbolic
    and material pressure distinct.
  rationale: The public cases in Section 5 are interpretive applications, not tests.
- id: no-fraud
  kind: normative
  passage: Flavoring does not imply fraud or false consciousness.
  rationale: Normative scope statement.
runs:
