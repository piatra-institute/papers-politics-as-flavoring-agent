claims:
- id: abs-n
  kind: computation
  passage: We build a minimal model containing both channels and a mixture parameter $\phi$, the flavoring
    share of the political premium, and solve it for 60,000 consumers.
  evidence:
    file: simulation/output/results.json
    run_id: flavoring
    pointer: /params/n_consumers
    reported: 60,000
    units: consumers
    conditions: model size
    decimals: 0
- id: abs-premium
  kind: computation
  passage: 'At the quality plateau the labeled market is invariant to $\phi$: choice data are identical
    for every split, and a political premium of $0.362$ functional-quality units is consistent with any
    $\phi$ in $[0, 1]$.'
  evidence:
    file: simulation/output/results.json
    run_id: flavoring
    pointer: /identification/political_premium_F0_units
    reported: '0.362'
    units: F0 units
    conditions: plateau F_R = F_L = F0, poles +/-1, symmetric weight 0.25, 60,000 consumers, seed 60240
    decimals: 3
- id: abs-swing
  kind: computation
  passage: Only the within-good difference between blind and labeled ratings, $0.202$ per unit of $\phi$
    for aligned consumers, identifies the split.
  evidence:
    file: simulation/output/results.json
    run_id: flavoring
    pointer: /identification/hedonic_swing_slope_in_phi
    reported: '0.202'
    units: hedonic rating per unit phi
    conditions: plateau F_R = F_L = F0, poles +/-1, symmetric weight 0.25, 60,000 consumers, seed 60240;
      aligned consumers
    decimals: 3
- id: abs-threshold
  kind: computation
  passage: Sweeping functional dispersion gives a threshold $\Delta F^* = 0.443$ below which politics
    decides most contested choices; ten categories placed on this axis split into bottled water through
    cosmetics on the flavor-dominated side and phones through medical devices on the other.
  evidence:
    file: simulation/output/results.json
    run_id: flavoring
    pointer: /plateau/threshold_dF_quarter_exact
    reported: '0.443'
    units: functional dispersion
    conditions: asymmetric weights lambda+ = 0.15, lambda- = 0.35, phi = 1, 60,000 consumers; bisection
    decimals: 3
- id: abs-ratio
  kind: computation
