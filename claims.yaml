- id: param-spread
  kind: computation
  passage: Consumer $i$ has a political position $x_i$ on a one-dimensional axis, drawn from a polarized
    electorate in which half the population clusters near $-\mu$ and half near $+\mu$, reflecting the
    affective sorting documented in the polarization literature [@iyengar2019]; here $\mu = 1$ and the
    within-group spread is $0.5$.
  evidence:
